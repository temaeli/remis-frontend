<!-- scroll over the header -->

@if (dialogRef) {
  <details-header
    cdkDrag
    cdkDragHandle
    cdkDragRootElement=".cdk-overlay-pane"
    [title]="title"
    class="border-b border-b-gray-200 cursor-drag"
  />

  <mat-dialog-content>
    <ng-container [ngTemplateOutlet]="contentsTpl" />
  </mat-dialog-content>

  <mat-dialog-actions>
    <action-buttons [actionButtons]="dialogButtons" />
  </mat-dialog-actions>
} @else {
  <ng-container [ngTemplateOutlet]="contentsTpl" />
}

<ng-template #contentsTpl>
  <div class="flex-1 flex flex-col size-full gap-2">
    <ng-container *ngIf="!loading && permittedContents.length; else noContent">
      <!-- contents navigation -->
      <ng-container
        [ngTemplateOutlet]="contentsTabsTpl"
        [ngTemplateOutletContext]="{ contents: permittedContents, level: 0 }"
      />

      <!-- contents -->
      <div class="{{ 'flex-1 flex flex-col' | mergeClasses: 'contentsParameters' }}">
        <ng-container *ngFor="let content of permittedContents; let i = index">
          <ng-container
            *ngIf="!!slugTree?.[0] ? slugTree?.[0] === content.slug : i == 0"
            [ngTemplateOutlet]="contentTpl"
            [ngTemplateOutletContext]="{ content: content | mergeObjects: content.mods, level: 1 }"
          /></ng-container>
      </div>
    </ng-container>
  </div>
</ng-template>

<ng-template #contentTpl let-content="content" let-parent="parent" let-level="level">
  <div
    *ngIf="content; else noContent"
    class="{{
      '  grid grid-cols-1   xl:grid-cols-[repeat(auto-fit,minmax(250px,1fr))]  gap-y-2 min-h-full'
        | mergeClasses: content.contentContainerClass
    }}"
  >
    <!-- content content -->
    <div *ngIf="content.type" class="{{ '  ' | mergeClasses: content.contentClass }}">
      <ng-container
        [ngTemplateOutlet]="contentContentTpl"
        [ngTemplateOutletContext]="{ content: content, class: '' }"
      />
    </div>

    <!-- content children container -->
    <div
      *ngIf="content.children?.length"
      class=" xl:[&:not(:first-child)]:ml-3
      {{ 'flex flex-col gap-2 ' | mergeClasses: content.contentChildrenClass }}"
    >
      <!-- children toggle -->
      <ng-container
        [ngTemplateOutlet]="contentsTabsTpl"
        [ngTemplateOutletContext]="{ contents: content?.children, level }"
      />

      <!-- TODO: remove the right gap from -->
      <div class="{{ 'size-full' | mergeClasses: content.childrenContentClass }}">
        <ng-container *ngFor="let child of content.children; let i = index">
          <!-- no slug show the first -->
          <ng-container *ngIf="child | mergeObjects: child.mods as child">
            <ng-container
              *ngIf="!!slugTree?.[level] ? slugTree?.[level] === child.slug : i == 0"
              [ngTemplateOutlet]="contentTpl"
              [ngTemplateOutletContext]="{ parent: content, content: child, level: level + 1 }"
            />
          </ng-container>
        </ng-container>
      </div>
    </div>

    <!--  -->
  </div>
</ng-template>

<ng-template #contentsTabsTpl let-contents="contents" let-level="level">
  <toggle-buttons
    valueKey="slug"
    *ngIf="contents.length > 1"
    [toggleButtons]="contents"
    [initialValue]="slugTree?.[level] ?? contents[0]?.slug ?? contents[0]?.slug"
    (value)="onContentChange($event, level)"
    class="{{ 'p-2 bg-white rounded-lg inline-flex flex-wrap' }}"
  />
</ng-template>

<ng-template #contentContentTpl let-content="content" let-parent="parent">
  <ng-container *hasPermission="content.permissions ?? []">
    <div
      #sectionElement
      class="{{
        ' size-full flex-1 flex flex-col rounded-lg h-full ' | mergeClasses: content.class
      }}
        {{ content.animation }} --order-{{ 3 }}  relative"
      *ngIf="
        !!content.entity ||
          !!content.gridData ||
          !!content.attachment ||
          !!content.fetchParameter ||
          !!content.content ||
          content.type;
        else noContent
      "
    >
      <bg-icon-mark [icon]="content.icon" />

      <!-- details -->

      <app-details
        class="size-full flex flex-col flex-1"
        theme="simple"
        *ngIf="content.type === 'details'"
        [detailsParameter]="content"
      />

      <!-- table -->
      <data-grid
        *ngIf="content.type === 'table'"
        class="size-full flex flex-col flex-1"
        theme="simple"
        [gridParameter]="content"
        [title]="content?.title ?? content?.label"
        [hasActionsColumn]="content?.hasActionsColumn || !!content?.actionButtons?.length"
      />

      <!-- html -->
      <div *ngIf="content.type === 'html'" class="absolute inset-0 flex flex-col overflow-hidden">
        @if (content.content) {
          <div
            class="flex-1 m-2 bg-white rounded-lg shadow-sm p-8 overflow-auto"
            [innerHTML]="content.content | safeHtml"
          ></div>
        } @else {
          <no-content
            class="flex-1 flex flex-col size-full justify-center items-center bg-white rounded-lg"
            icon="description"
            label="No content generated yet"
          />
        }
      </div>

      <!-- dynamic component slot -->
      <ng-container
        *ngIf="content.type === 'component' && content.componentType"
        [ngComponentOutlet]="content.componentType"
        [ngComponentOutletInputs]="content.componentInputs || {}"
      />

      <!-- attachment TODO: implement view Attachment -->
      <!-- <view-attachment
          *ngIf="content.type === 'attachment'"
          class="d-block col px-0 over-flow-hidden"
          [attachmentParameter]="content"
        ></view-attachment> -->
    </div>
  </ng-container>
</ng-template>

<ng-template #noContent>
  <no-content
    class="flex-1 flex flex-col no-content size-full justify-center items-center bg-white rounded-lg"
    [icon]="icon === '' ? 'warning' : icon"
    [label]="noContentLabel"
  />
</ng-template>
