<input matInput class="mat-select-search-input mat-select-search-hidden" />

<div
  class="mat-select-search-inner pt-2"
  [ngClass]="{ 'mat-select-search-inner-multiple': matSelect.multiple }"
>
  <div class="relative">
    <mat-icon class="search-icon" svgIcon="search" />
    <input
      matInput
      class="mat-select-search-input"
      #searchSelectInput
      (keydown)="_handleKeydown($event)"
      (input)="onInputChange($event)"
      (blur)="onBlur($event)"
      [placeholder]="placeholderLabel"
      autocomplete="off"
    />
    <button *ngIf="value" aria-label="Clear" (click)="_reset(true)" class="mat-select-search-clear">
      <mat-icon svgIcon="cancel" />
    </button>
  </div>
</div>

@if (noEntriesFoundLabel && value && _options?.length === 0) {
  <div class="mat-select-search-no-entries-found">
    {{ noEntriesFoundLabel }}
  </div>
}
