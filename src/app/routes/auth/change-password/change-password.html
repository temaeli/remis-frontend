<div class="dialog-container">
  <app-dialog-header 
    title="Change Password" 
    (close)="onCancel()" />

  <div class="dialog-content">
    <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
      <!-- Old Password -->
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Old Password</mat-label>
        <input
          matInput
          [type]="hideOldPassword() ? 'password' : 'text'"
          formControlName="oldPassword"
          placeholder="Enter your current password"
        />
        <button
          mat-icon-button
          matSuffix
          type="button"
          (click)="toggleOldPasswordVisibility()"
        >
          <mat-icon>{{ hideOldPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error *ngIf="passwordForm.get('oldPassword')?.hasError('required')">
          Old password is required
        </mat-error>
        <mat-error *ngIf="passwordForm.get('oldPassword')?.hasError('minlength')">
          Password must be at least 6 characters
        </mat-error>
      </mat-form-field>

      <!-- New Password -->
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>New Password</mat-label>
        <input
          matInput
          [type]="hideNewPassword() ? 'password' : 'text'"
          formControlName="newPassword"
          placeholder="Enter your new password"
        />
        <button
          mat-icon-button
          matSuffix
          type="button"
          (click)="toggleNewPasswordVisibility()"
        >
          <mat-icon>{{ hideNewPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error *ngIf="passwordForm.get('newPassword')?.invalid">
          {{ getPasswordError() }}
        </mat-error>
        <mat-hint>
          Password must be at least 8 characters with uppercase, lowercase, number and special
          character
        </mat-hint>
      </mat-form-field>

      <!-- Confirm Password -->
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Confirm New Password</mat-label>
        <input
          matInput
          [type]="hideConfirmPassword() ? 'password' : 'text'"
          formControlName="confirmPassword"
          placeholder="Re-enter your new password"
        />
        <button
          mat-icon-button
          matSuffix
          type="button"
          (click)="toggleConfirmPasswordVisibility()"
        >
          <mat-icon>{{ hideConfirmPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error *ngIf="passwordForm.get('confirmPassword')?.hasError('required')">
          Please confirm your password
        </mat-error>
        <mat-error *ngIf="passwordForm.hasError('passwordMismatch') && passwordForm.get('confirmPassword')?.touched">
          Passwords do not match
        </mat-error>
      </mat-form-field>

      <!-- Action Buttons -->
      <div class="dialog-actions">
        <button mat-stroked-button type="button" (click)="onCancel()" [disabled]="loading()">
          Cancel
        </button>
        <button mat-raised-button color="primary" type="submit" [disabled]="loading()">
          <mat-icon *ngIf="loading()">
            <span class="spinner"></span>
          </mat-icon>
          {{ loading() ? 'Changing...' : 'Change Password' }}
        </button>
      </div>
    </form>
  </div>
</div>
