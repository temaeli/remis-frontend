<div class="bg-white size-full relative flex flex-col">
  <header
    class="header-bar min-h-14 bg-primary overflow-hidden stick-top flex items-center px-4 sm:px-6 justify-between
    {{ animation }} --order-3 z-100 top-0 left-0 shadow-lg"
  >
    <div class="flex relative gap-3 items-center min-w-0 z-10">
      <img class="w-9 h-auto shrink-0" src="{{ 'icon' | appVariables }}" alt="" />
      <span class="w-px h-7 bg-white/25 shrink-0" aria-hidden="true"></span>
      <div class="min-w-0 leading-tight">
        <div class="brand-name text-white text-[17px] font-semibold tracking-tight truncate">
          {{ 'name' | appVariables }}
        </div>
        <div class="brand-tagline hidden sm:block text-white/55 truncate">
          Real Estate Management Information System
        </div>
      </div>
    </div>

    <div class="flex items-center z-10">
      <app-user [animation]="animation" />
      <span class="opacity-30 text-white {{ animation }} --order-3" aria-hidden="true"> | </span>

      <action-buttons
        [actionButtons]="st.actionButtons"
        [animation]="animation"
        [data]="this"
        class="ms-2 flex flex-center gap-2 flex-wrap"
      />
    </div>
  </header>

  <div class="grow overflow-y-auto bg-light flex justify-center items-start relative">
    <!-- Registry-themed background: parcel grid + faint survey/seal watermarks -->
    <div class="absolute inset-0 bg-white"></div>
    <div class="registry-grid"></div>
    <svg class="registry-seal" viewBox="0 0 200 200" fill="none" stroke="currentColor" aria-hidden="true" focusable="false">
      <circle cx="100" cy="100" r="92" stroke-width="1" />
      <circle cx="100" cy="100" r="74" stroke-width="1" />
      <circle cx="100" cy="100" r="3.5" fill="currentColor" stroke="none" />
      <path d="M100 8v22M100 170v22M8 100h22M170 100h22" stroke-width="1" />
      <path d="M60 130V80l40-24 40 24v50" stroke-width="1.6" />
      <path d="M40 152h120" stroke-width="1" />
    </svg>
    <svg class="registry-seal registry-seal--alt" viewBox="0 0 200 200" fill="none" stroke="currentColor" aria-hidden="true" focusable="false">
      <rect x="14" y="14" width="172" height="172" stroke-width="1" />
      <path d="M14 14L186 186M186 14L14 186" stroke-width="0.6" opacity="0.5" />
      <polygon points="46,140 60,58 150,44 168,120 120,166" stroke-width="1.6" />
    </svg>

    <div class="mx-auto flex-1 max-w-6xl p-4 sm:p-6 lg:p-12 relative z-10">
      <div class="mb-6 text-center sm:text-left">
        <p class="directory-eyebrow">Module Directory</p>
        <h1 class="directory-title">Select a module to continue</h1>
      </div>

      <div class="module-grid">
        @for (module of modules(); track module.route; let i = $index) {
          <a
            class="module-tile"
            [routerLink]="['', module.route]"
            aria-label="Open {{ module.name }} module"
          >
            <div class="tile-top" aria-hidden="true">
              <span class="tile-num">{{ (i + 1).toString().padStart(2, '0') }}</span>
              <span class="tile-code">{{ moduleCode(module.name) }}</span>
            </div>
            <span class="tile-icon" aria-hidden="true">
              <mat-icon [svgIcon]="module.icon" />
            </span>
            <span class="tile-name">{{ module.name }}</span>
            <span class="tile-cta">Open module <span aria-hidden="true">&rarr;</span></span>
          </a>
        }
      </div>
    </div>
  </div>
</div>
